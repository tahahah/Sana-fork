<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman Dataset Visualization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Pacman Dataset Visualization</h1>
            <div class="settings">
                <div class="form-group">
                    <label for="sequenceLength">Sequence Length:</label>
                    <input type="number" id="sequenceLength" class="form-control" value="8" min="2" max="32">
                </div>
                <div class="form-group">
                    <label for="resolution">Resolution:</label>
                    <input type="number" id="resolution" class="form-control" value="128" min="64" max="512" step="64">
                </div>
                <button id="initDataset" class="btn btn-primary">Initialize Dataset</button>
            </div>
            
            <!-- Stagger offset controls (moved outside the initialization form) -->
            <div class="card mt-3 mb-3">
                <div class="card-body">
                    <h5 class="card-title">Action Stagger Offset <span class="badge bg-info text-white">Adjust anytime</span></h5>
                    <div class="form-group">
                        <label for="staggerOffset">Current offset: <span id="staggerOffsetValue">1</span> frame(s)</label>
                        <div class="stagger-offset-controls">
                            <button type="button" id="decrementOffset" class="btn btn-sm btn-outline-secondary" title="Decrease offset">-</button>
                            <input type="range" id="staggerOffset" class="form-range" min="-5" max="5" value="1" step="1" aria-label="Stagger offset">
                            <button type="button" id="incrementOffset" class="btn btn-sm btn-outline-secondary" title="Increase offset">+</button>
                        </div>
                        <div class="form-text small text-muted">
                            <span>Positive: show past actions</span><br>
                            <span>Negative: show future actions</span><br>
                            <span class="text-info"><i class="bi bi-info-circle"></i> Slide or click ± to re-label the current sequence immediately</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div class="controls">
                <button id="nextSequence" class="btn btn-success">Next Sequence</button>
                <button id="toggleCache" class="btn btn-info">Show Cache</button>
            </div>

            <div id="loadingIndicator" class="spinner-border text-primary" role="status" style="display: none;">
                <span class="visually-hidden">Loading...</span>
            </div>

            <div id="sequenceContainer" class="sequence-container">
                <!-- Sequence visualization will be dynamically inserted here -->
            </div>

            <div id="cacheContainer" class="cache-container" style="display: none;">
                <h3>Cached Sequences</h3>
                <div id="cacheList" class="row"></div>
            </div>
        </main>
    </div>

    <!-- Sequence Template -->
    <template id="sequenceTemplate">
        <div class="sequence-wrapper">
            <h2 class="sequence-title">Observation Frames & Actions</h2>
            <div class="frames-container">
                <!-- Frames will be inserted here -->
            </div>
            <div class="target-container">
                <h3>Target Frame</h3>
                <div class="target-wrapper">
                    <img class="target-image" src="" alt="Target Image">
                </div>
            </div>
        </div>
    </template>

    <!-- Frame Template -->
    <template id="frameTemplate">
        <div class="frame-wrapper">
            <div class="frame-number"></div>
            <img class="frame-image" src="" alt="Frame">
            <div class="frame-action"></div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
