data:
  type: PacmanMapDataset  # Map-style with random access (replaces streaming PacmanDataset)
  data_dir: ["datasets/pacman_latents"]  # Precomputed VAE latents for target frames
  resolution: 256
  sequence_length: 4  # Length of action sequences (3 obs frames + 1 target)
  load_text_feat: false
  load_vae_feat: true  # Use precomputed VAE latents for target frames
  transform: default_train
  buffer_size: 200
  prefetch_factor: 4
  sort_dataset: false
# model config
model:
  model: SanaMS_PACMAN_P1_D12
  image_size: 256
  in_channels: 8  # concat of x_t (4ch) + obs_latent (4ch)
  mixed_precision: fp16
  fp32_attention: true  # fp16 attention needs fp32 fallback for stability
  load_from:
  resume_from:
    checkpoint: latest  # Resume the v2 run after the checkpoint-symlink crash
    load_ema: false
    resume_lr_scheduler: true  # Continue the cosine schedule where it left off
    resume_optimizer: true  # Continue optimizer state
  aspect_ratio_type: ASPECT_RATIO_512
  multi_scale: false
  attn_type: linear
  linear_head_dim: 32
  ffn_type: glumbconv
  mlp_acts:
    - silu
    - silu
    - null
  mlp_ratio: 2.5
  use_pe: true
  torch_compile: false  # Disabled — dynamic=True caused 2.3x slowdown
  qk_norm: false
  class_dropout_prob: 0.1
  pe_interpolation: true
  micro_condition: true
  autocast_linear_attn: true
  num_classes: 5

# VAE setting
vae:
  vae_type: TAESD
  vae_pretrained: madebyollin/taesd
  scale_factor: 1.0  # TAESD scaling factor is 1.0
  vae_latent_dim: 4
  vae_downsample_rate: 8
  sample_posterior: true
  finetuned_decoder: output/vae_decoder_ft/vae_decoder_ft_best.pth  # Pacman-fine-tuned decoder (encoder unchanged)
# Sana schedule Flow
scheduler:
  predict_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  flow_shift: 1.0
  # logit-normal timestep
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_euler
  vis_sampler_steps: 2  # 2-step Euler — real-time; quality holds with the fine-tuned decoder
  train_sampling_steps: 1000

# training setting
train:
  num_workers: 8  # Multi-worker OK with Map-style dataset (random access, no sharding issues)
  seed: 1
  train_batch_size: 64
  num_epochs: 100
  gradient_accumulation_steps: 1
  grad_checkpointing: false
  gradient_clip: 0.1
  optimizer:
    betas:
      - 0.9
      - 0.999
      - 0.9999
    eps:
      - 1.0e-30
      - 1.0e-16
    lr: 0.0001
    type: CAMEWrapper
    weight_decay: 0.0
  lr_schedule: cosine
  lr_schedule_args:
    num_warmup_steps: 2000
    num_training_steps: 100000  # Cosine decay over 100k steps
  local_save_vis: true # if save log image locally
  visualize: true
  eval_sampling_steps: 500
  log_interval: 20
  save_model_epochs: 1
  save_model_steps: 2500  # tighter checkpointing — capture the quality climb (keep_last=6)
  work_dir: output/pacman_latent_v2
  online_metric: false
  eval_metric_step: 2000
  online_metric_dir: metric_helper
