<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Action Visualizer</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <h1>Frame Action Visualizer</h1>

    <div class="controls">
        <label for="staggerOffset">Stagger Offset (N):</label>
        <input type="number" id="staggerOffset" value="0">
        <button id="loadDataBtn">Load Sequence Data</button>
    </div>

    <div id="visualizationContainer">
        <!-- Frames and actions will be dynamically inserted here by JavaScript -->
    </div>

    <script src="{{ url_for('static', path='script.js') }}"></script>
</body>
</html>
