<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Action Visualizer</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <h1>Frame Action Visualizer</h1>

    <p class="info-area">
        If you encounter issues (e.g., images not loading, actions not displaying correctly), 
        please open your browser's developer console (usually by pressing F12) and check the 
        "Console" and "Network" tabs for error messages. Provide these messages when reporting the issue.
    </p>

    <div class="controls">
        <label for="staggerOffset">Stagger Offset (N):</label>
        <input type="number" id="staggerOffset" value="0">
        <button id="loadDataBtn">Load Sequence Data</button>
    </div>

    <div id="visualizationContainer">
        <!-- Frames and actions will be dynamically inserted here by JavaScript -->
    </div>

    <script src="{{ url_for('static', path='script.js') }}"></script>
</body>
</html>
